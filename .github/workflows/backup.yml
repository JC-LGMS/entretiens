name: Sauvegarde chiffrée

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AGE_PUBLIC_KEY: ${{ vars.AGE_PUBLIC_KEY || secrets.AGE_PUBLIC_KEY }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Vérifier la configuration
        run: |
          : "${SUPABASE_PROJECT_REF:?SUPABASE_PROJECT_REF manquant}"
          : "${SUPABASE_DB_URL:?SUPABASE_DB_URL manquant}"
          : "${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY manquant}"
          : "${AGE_PUBLIC_KEY:?AGE_PUBLIC_KEY manquant}"

      - name: Dump complet du schéma public
        run: |
          mkdir -p backup
          docker run --rm \
            -e SUPABASE_DB_URL \
            -v "$PWD/backup:/backup" \
            postgres:17 \
            sh -c 'pg_dump "$SUPABASE_DB_URL" --schema=public --no-owner --no-privileges --file=/backup/public.sql'
          test -s backup/public.sql
          grep -qE '^(COPY|INSERT INTO)' backup/public.sql || (echo "Le dump ne contient aucune donnée" && exit 1)

      - name: Copie des photos
        run: |
          SUPABASE_URL="https://${SUPABASE_PROJECT_REF}.supabase.co" \
          PHOTOS_DEST=backup \
          node scripts/backup-photos.mjs

      - name: Archive et chiffrement
        run: |
          sudo apt-get update
          sudo apt-get install -y age
          DATE=$(date -u +%F)
          ARCHIVE="entretiens-backup-${DATE}.tar.gz"
          tar -czf "$ARCHIVE" backup
          age -r "$AGE_PUBLIC_KEY" -o "${ARCHIVE}.age" "$ARCHIVE"
          sha256sum "${ARCHIVE}.age" > checksums.txt
          rm -f "$ARCHIVE"
          rm -rf backup
          {
            echo "### Sauvegarde ${DATE}"
            echo ""
            echo "- Fichier : \`${ARCHIVE}.age\`"
            echo "- Taille : $(du -h "${ARCHIVE}.age" | cut -f1)"
            echo "- Empreinte : \`$(cut -d' ' -f1 checksums.txt)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: entretiens-backup-${{ github.run_id }}
          path: |
            entretiens-backup-*.tar.gz.age
            checksums.txt
          retention-days: 180
          if-no-files-found: error
